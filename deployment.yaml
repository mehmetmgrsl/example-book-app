apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-book-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-book-app
  template:
    metadata:
      labels:
        app: example-book-app
    spec:
      containers:
        - name: example-book-app
          image: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/example-book-app:latest
          ports:
            - containerPort: 8080

